# Ultralytics YOLO 🚀, AGPL-3.0 license
# Hyper-YOLO with Expansion Attention (Fixed v7)

# Parameters
nc: 3  # number of classes
scales:
  n: [0.33, 0.25, 1024, 6]
  s: [0.33, 0.50, 1024, 8]
  m: [0.67, 0.75, 768, 10]
  l: [1.00, 1.00, 512, 10]
  x: [1.00, 1.25, 512, 12]

# Hyper-YOLO backbone with Expansion Attention
backbone:
  # 初始卷积层，逐步增加通道数
  - [-1, 1, Conv, [32, 3, 2]]        # 0-P1/2 (3->32)
  - [-1, 1, Conv, [64, 3, 2]]        # 1-P2/4 (32->64)
  
  # 第一个DownsampleProtection - 此时是64通道
  - [-1, 1, DownsampleProtection, [64]]  # 2
  
  # 继续下采样
  - [-1, 1, Conv, [128, 3, 2]]       # 3-P3/8 (64->128)
  - [-1, 3, MANet, [128, True, 2, 3]] # 4-B2/4
  
  # 第二个DownsampleProtection - 此时是128通道
  - [-1, 1, DownsampleProtection, [128]] # 5
  
  - [-1, 1, Conv, [256, 3, 2]]       # 6-P4/16 (128->256)
  - [-1, 6, MANet, [256, True, 2, 5]] # 7-B3/8
  
  # 第三个DownsampleProtection - 此时是256通道
  - [-1, 1, DownsampleProtection, [256]] # 8
  
  - [-1, 1, Conv, [512, 3, 2]]       # 9-P5/32 (256->512)
  - [-1, 6, MANet, [512, True, 2, 5]] # 10-B4/16
  
  # 第四个DownsampleProtection - 此时是512通道
  - [-1, 1, DownsampleProtection, [512]] # 11
  
  - [-1, 1, Conv, [1024, 3, 2]]      # 12-P6/64 (512->1024)
  - [-1, 3, MANet, [1024, True, 2, 3]] # 13
  - [-1, 1, SPPF, [1024, 5]]         # 14-B5/32

# Hyper-YOLO head with Expansion Attention
head:
  # Semantic Collecting
  - [0, 1, nn.AvgPool2d, [16, 16, 0]]   # 15
  - [4, 1, nn.AvgPool2d, [8, 8, 0]]     # 16
  - [7, 1, nn.AvgPool2d, [4, 4, 0]]     # 17
  - [14, 1, nn.Upsample, [None, 2, 'nearest']] # 18
  - [[15, 16, 17, 10, 18], 1, Concat, [1]]  # 19 cat

  # Hypergraph Computation
  - [-1, 1, Conv, [512, 1, 1]]         # 20
  - [-1, 1, HyperComputeModule, [512]] # 21
  - [-1, 3, MANet, [512, True, 2, 3]]  # 22

  # Semantic Collecting
  - [-1, 1, nn.AvgPool2d, [2, 2, 0]]   # 23
  - [[-1, 14], 1, Concat, [1]]         # 24 cat
  - [-1, 1, Conv, [1024, 1, 1]]        # 25 P5

  - [[22, 10], 1, Concat, [1]]         # 26 cat
  - [-1, 3, MANet, [512, False, 2, 3]] # 27 P4

  - [22, 1, nn.Upsample, [None, 2, 'nearest']] # 28
  - [[-1, 7], 1, Concat, [1]]          # 29 cat

  # 👇 P3前加Expansion Attention
  - [-1, 1, Conv, [256, 1, 1]]         # 30
  - [-1, 1, ExpansionAttentionLight, [256]]  # 31
  - [-1, 1, Conv, [256, 1, 1]]         # 32

  - [-1, 3, MANet, [256, False, 2, 3]] # 33 P3/N3

  - [-1, 1, Conv, [256, 3, 2]]         # 34
  - [[-1, 27], 1, Concat, [1]]         # 35 cat
  - [-1, 3, MANet, [512, False, 2, 3]] # 36 N4

  - [-1, 1, Conv, [512, 3, 2]]         # 37
  - [[-1, 25], 1, Concat, [1]]         # 38 cat
  - [-1, 3, C2f, [1024, False]]        # 39 N5

  - [[33, 36, 39], 1, Detect, [nc]]    # 40 Detect