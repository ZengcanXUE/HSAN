# Ultralytics YOLO 🚀, AGPL-3.0 license
# Hyper-YOLO with LBASwinTransformer

# Parameters
nc: 3  # number of classes
scales:
  n: [0.33, 0.25, 1024, 6]
  s: [0.33, 0.50, 1024, 8]
  m: [0.67, 0.75, 768, 10]
  l: [1.00, 1.00, 512, 10]
  x: [1.00, 1.25, 512, 12]

# Hyper-YOLO backbone with LBASwinTransformer
backbone:
  - [-1, 1, Conv, [64, 3, 2]]        # 0-B1/2
  - [-1, 1, Conv, [128, 3, 2]]       # 1
  
  # 👇 将窗口大小改为 8（能整除 160）
  - [-1, 3, LBASwinTransformerBlock, [128, 8, 8, 0, 4.]]  # 2 (dim=128, heads=8, window=8)
  
  - [-1, 1, Conv, [256, 3, 2]]       # 3
  # 👇 窗口大小 8 能整除 80
  - [-1, 6, LBASwinTransformerBlock, [256, 12, 8, 0, 4.]] # 4
  
  - [-1, 1, Conv, [512, 3, 2]]       # 5
  # 👇 窗口大小 8 能整除 40
  - [-1, 6, LBASwinTransformerBlock, [512, 16, 8, 0, 4.]] # 6
  
  - [-1, 1, Conv, [1024, 3, 2]]      # 7-P5/32
  # 👇 窗口大小 4 能整除 20
  - [-1, 3, LBASwinTransformerBlock, [1024, 24, 4, 0, 4.]] # 8
  - [-1, 1, SPPF, [1024, 5]]         # 9-B5/32

# Hyper-YOLO head with LBASwinTransformer
head:
  # Semantic Collecting
  - [0, 1, nn.AvgPool2d, [8, 8, 0]]     # 10
  - [2, 1, nn.AvgPool2d, [4, 4, 0]]     # 11
  - [4, 1, nn.AvgPool2d, [2, 2, 0]]     # 12
  - [9, 1, nn.Upsample, [None, 2, 'nearest']] # 13
  - [[10, 11, 12, 6, 13], 1, Concat, [1]]  # 14 cat

  # Hypergraph Computation
  - [-1, 1, Conv, [512, 1, 1]]         # 15
  - [-1, 1, HyperComputeModule, [512]] # 16
  
  # 👇 在超图计算后添加LBASwinTransformer
  - [-1, 1, LBASwinTransformerBlock, [512, 16, 8, 0, 4.]]  # 17
  
  - [-1, 3, MANet, [512, True, 2, 3]]  # 18

  # Semantic Collecting
  - [-1, 1, nn.AvgPool2d, [2, 2, 0]]   # 19
  - [[-1, 9], 1, Concat, [1]]          # 20 cat
  - [-1, 1, Conv, [1024, 1, 1]]        # 21 P5

  - [[18, 6], 1, Concat, [1]]          # 22 cat
  - [-1, 3, MANet, [512, False, 2, 3]] # 23 P4

  - [18, 1, nn.Upsample, [None, 2, 'nearest']] # 24
  - [[-1, 4], 1, Concat, [1]]          # 25 cat

  # 👇 P3前添加LBASwinTransformer（小目标增强）
  - [-1, 1, Conv, [256, 1, 1]]         # 26
  - [-1, 1, LBASwinTransformerBlock, [256, 8, 8, 0, 4.]]  # 27
  - [-1, 1, Conv, [256, 1, 1]]         # 28

  - [-1, 3, MANet, [256, False, 2, 3]] # 29 P3/N3

  - [-1, 1, Conv, [256, 3, 2]]         # 30
  - [[-1, 23], 1, Concat, [1]]         # 31 cat
  - [-1, 3, MANet, [512, False, 2, 3]] # 32 N4

  - [-1, 1, Conv, [512, 3, 2]]         # 33
  - [[-1, 21], 1, Concat, [1]]         # 34 cat
  - [-1, 3, C2f, [1024, False]]        # 35 N5

  - [[29, 32, 35], 1, Detect, [nc]]    # 36 Detect