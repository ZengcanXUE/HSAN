# Ultralytics YOLO 🚀, AGPL-3.0 license
# Hyper-YOLO with MHSA (Multi-Head Self-Attention)
# Focus on distinguishing similar behaviors (hand-raising, reading, writing)

# Parameters
nc: 6  # number of classes
scales:
  n: [0.33, 0.25, 1024, 6]
  s: [0.33, 0.50, 1024, 8]
  m: [0.67, 0.75, 768, 10]
  l: [1.00, 1.00, 512, 10]
  x: [1.00, 1.25, 512, 12]

# Hyper-YOLO backbone (保持不变)
backbone:
  - [-1, 1, Conv, [64, 3, 2]]        # 0-B1/2
  - [-1, 1, Conv, [128, 3, 2]]       # 1
  - [-1, 3, MANet, [128, True, 2, 3]] # 2-B2/4
  - [-1, 1, Conv, [256, 3, 2]]       # 3
  - [-1, 6, MANet, [256, True, 2, 5]] # 4-B3/8
  - [-1, 1, Conv, [512, 3, 2]]       # 5
  - [-1, 6, MANet, [512, True, 2, 5]] # 6-B4/16
  - [-1, 1, Conv, [1024, 3, 2]]      # 7-P5/32
  - [-1, 3, MANet, [1024, True, 2, 3]] # 8
  - [-1, 1, SPPF, [1024, 5]]         # 9-B5/32

# Hyper-YOLO head with MHSA
head:
  # Semantic Collecting
  - [0, 1, nn.AvgPool2d, [8, 8, 0]]     # 10
  - [2, 1, nn.AvgPool2d, [4, 4, 0]]     # 11
  - [4, 1, nn.AvgPool2d, [2, 2, 0]]     # 12
  - [9, 1, nn.Upsample, [None, 2, 'nearest']] # 13
  - [[10, 11, 12, 6, 13], 1, Concat, [1]]  # 14 cat

  # Hypergraph Computation
  - [-1, 1, Conv, [512, 1, 1]]         # 15
  - [-1, 1, HyperComputeModule, [512]] # 16
  - [-1, 3, MANet, [512, True, 2, 3]]  # 17

  # Semantic Collecting
  - [-1, 1, nn.AvgPool2d, [2, 2, 0]]   # 18
  - [[-1, 9], 1, Concat, [1]]          # 19 cat
  - [-1, 1, Conv, [1024, 1, 1]]        # 20 P5

  - [[17, 6], 1, Concat, [1]]          # 21 cat
  - [-1, 3, MANet, [512, False, 2, 3]] # 22 P4

  - [17, 1, nn.Upsample, [None, 2, 'nearest']] # 23
  - [[-1, 4], 1, Concat, [1]]          # 24 cat

  # 👇 位置1：特征融合后添加MHSA（增强全局上下文理解）
  - [-1, 1, Conv, [256, 1, 1]]         # 25 降维到256（输入192→256）
  - [-1, 1, MHSALight, [256, 4]]       # 26 MHSA处理 (4 heads)
  - [-1, 1, Conv, [256, 1, 1]]         # 27 保持256通道

  # 👇 位置2：P3小目标检测层前添加MHSA（区分相似行为）
  - [-1, 1, Conv, [256, 1, 1]]         # 28 降维到256
  - [-1, 1, MHSALight, [256, 4]]       # 29 MHSA处理 (4 heads)
  - [-1, 1, Conv, [256, 1, 1]]         # 30 保持256通道

  - [-1, 3, MANet, [256, False, 2, 3]] # 31 P3/N3

  - [-1, 1, Conv, [256, 3, 2]]         # 32
  - [[-1, 22], 1, Concat, [1]]         # 33 cat
  - [-1, 3, MANet, [512, False, 2, 3]] # 34 N4

  - [-1, 1, Conv, [512, 3, 2]]         # 35
  - [[-1, 20], 1, Concat, [1]]         # 36 cat
  - [-1, 3, C2f, [1024, False]]        # 37 N5

  - [[31, 34, 37], 1, Detect, [nc]]    # 38 Detect