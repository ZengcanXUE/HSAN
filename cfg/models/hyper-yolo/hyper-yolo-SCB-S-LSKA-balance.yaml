# Ultralytics YOLO 🚀, AGPL-3.0 license
# Hyper-YOLO with LSKA Attention (Balanced version) - Fully Fixed
# 4 LSKA modules with proper channel matching

# Parameters
nc: 3  # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels, threshold]
  n: [0.33, 0.25, 1024, 6]
  s: [0.33, 0.50, 1024, 8]
  m: [0.67, 0.75, 768, 10]
  l: [1.00, 1.00, 512, 10]
  x: [1.00, 1.25, 512, 12]

# Hyper-YOLO backbone (保持不变)
backbone:
  - [-1, 1, Conv, [64, 3, 2]]        # 0-B1/2
  - [-1, 1, Conv, [128, 3, 2]]       # 1
  - [-1, 3, MANet, [128, True, 2, 3]] # 2-B2/4
  - [-1, 1, Conv, [256, 3, 2]]       # 3
  - [-1, 6, MANet, [256, True, 2, 5]] # 4-B3/8
  - [-1, 1, Conv, [512, 3, 2]]       # 5
  - [-1, 6, MANet, [512, True, 2, 5]] # 6-B4/16
  - [-1, 1, Conv, [1024, 3, 2]]      # 7-P5/32
  - [-1, 3, MANet, [1024, True, 2, 3]] # 8
  - [-1, 1, SPPF, [1024, 5]]         # 9-B5/32

# Hyper-YOLO head with LSKA (Fully Fixed)
head:
  # Semantic Collecting
  - [0, 1, nn.AvgPool2d, [8, 8, 0]]     # 10
  - [2, 1, nn.AvgPool2d, [4, 4, 0]]     # 11
  - [4, 1, nn.AvgPool2d, [2, 2, 0]]     # 12
  - [9, 1, nn.Upsample, [None, 2, 'nearest']] # 13
  - [[10, 11, 12, 6, 13], 1, Concat, [1]]  # 14 cat

  # 👇 位置1：特征融合后添加LSKA（需要先降维）
  - [-1, 1, Conv, [512, 1, 1]]         # 15 降维到512（输入496→512）
  - [-1, 1, LSKA_Attention, [512, 7]]  # 16 LSKA处理
  - [-1, 1, Conv, [512, 1, 1]]         # 17 保持512通道

  # Hypergraph Computation
  - [-1, 1, Conv, [512, 1, 1]]         # 18
  - [-1, 1, HyperComputeModule, [512]] # 19
  - [-1, 3, MANet, [512, True, 2, 3]]  # 20

  # Semantic Collecting
  - [-1, 1, nn.AvgPool2d, [2, 2, 0]]   # 21
  - [[-1, 9], 1, Concat, [1]]          # 22 cat

  # 👇 位置2：P5前添加LSKA（需要先降维）
  - [-1, 1, Conv, [1024, 1, 1]]        # 23 降维到1024（输入384→1024）
  - [-1, 1, LSKA_Attention, [1024, 7]] # 24 LSKA处理
  - [-1, 1, Conv, [1024, 1, 1]]        # 25 保持1024通道

  - [-1, 1, Conv, [1024, 1, 1]]        # 26 P5

  - [[20, 6], 1, Concat, [1]]          # 27 cat
  - [-1, 3, MANet, [512, False, 2, 3]] # 28 P4

  - [20, 1, nn.Upsample, [None, 2, 'nearest']] # 29
  - [[-1, 4], 1, Concat, [1]]          # 30 cat

  # 👇 位置3：P3小目标检测层前添加LSKA（k=5，适合小目标）
  - [-1, 1, Conv, [256, 1, 1]]         # 31 降维到256（输入192→256）
  - [-1, 1, LSKA_Attention, [256, 5]]  # 32 LSKA处理小目标特征
  - [-1, 1, Conv, [256, 1, 1]]         # 33 保持256通道

  - [-1, 3, MANet, [256, False, 2, 3]] # 34 P3/N3

  - [-1, 1, Conv, [256, 3, 2]]         # 35
  - [[-1, 28], 1, Concat, [1]]         # 36 cat

  # 👇 位置4：N4中目标检测层后添加LSKA
  - [-1, 1, Conv, [512, 1, 1]]         # 37 降维到512（输入192→512）
  - [-1, 1, LSKA_Attention, [512, 7]]  # 38 LSKA处理
  - [-1, 1, Conv, [512, 1, 1]]         # 39 保持512通道

  - [-1, 3, MANet, [512, False, 2, 3]] # 40 N4

  - [-1, 1, Conv, [512, 3, 2]]         # 41
  - [[-1, 26], 1, Concat, [1]]         # 42 cat
  - [-1, 3, C2f, [1024, False]]        # 43 N5

  - [[34, 40, 43], 1, Detect, [nc]]    # 44 Detect